name: 持续集成

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# 同一分支的新推送自动取消旧运行，避免三平台矩阵排队堆积。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 测试与构建 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15
          - ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: 安装 pnpm
        run: corepack enable

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy,rustfmt

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 检查变更文件格式与打包范围
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/check-ci-changes.mjs

      - name: 检查 Rust 格式
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: 获取锁定的 Rust 依赖
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked

      - name: 验证第三方许可证清单
        run: pnpm licenses:check

      - name: 运行 Node 测试
        run: pnpm test

      - name: 检查代码规范
        run: pnpm lint

      - name: 构建 Web 前端
        run: pnpm build

      - name: 检查 Rust 代码规范
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: 编译测试 Tauri 桌面端
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # 仅关闭更新包签名产物，不覆盖应用本身的打包与签名配置。
      - name: 验证安装包构建
        if: steps.changes.outputs.packaging == 'true'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) bundles=nsis ;;
            macOS) bundles=app,dmg ;;
            Linux) bundles=deb ;;
            *) echo "::error::不支持的平台：$RUNNER_OS"; exit 1 ;;
          esac
          bash scripts/verify-ci-package.sh "$bundles"
