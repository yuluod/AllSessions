name: 发布 Tauri 安装包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并发布的已有版本标签，例如 v0.0.6"
        required: true
        type: string

permissions:
  contents: write

jobs:
  quality:
    name: 发布前质量门禁
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: 安装 pnpm
        run: corepack enable

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 获取锁定的 Rust 依赖
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked

      - name: 验证第三方许可证清单
        run: pnpm licenses:check

      - name: 运行 Node 测试
        run: pnpm test

      - name: 检查代码规范
        run: pnpm lint

      - name: 构建 Web 前端
        run: pnpm build

      - name: 检查 Rust 代码规范
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: 编译测试 Tauri 桌面端
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  build-installers:
    name: ${{ matrix.name }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
            bundles: nsis
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            platform: mac
            arch: arm64
            bundles: app,dmg
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            platform: mac
            arch: x64
            bundles: app,dmg
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            bundles: deb
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: 安装 pnpm
        run: corepack enable

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 构建依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Tauri 安装包
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: 收集发布与更新安装包
        shell: bash
        run: |
          node scripts/collect-tauri-artifact.mjs --target ${{ matrix.target }} --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: 暂存平台安装包
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: release/*

  publish:
    name: 完整发布所有平台
    needs: build-installers
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: 下载所有平台安装包
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: 提取当前版本更新日志
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node scripts/extract-release-notes.mjs "$RELEASE_TAG" CHANGELOG.md release-notes.md

      - name: 创建或复用发布草稿
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != "true" ]]; then
              echo "::error::标签 $RELEASE_TAG 已有正式 Release；为避免部分覆盖，本次不会修改它。"
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "AllSessions $RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "AllSessions $RELEASE_TAG" --notes-file release-notes.md
          fi

          mapfile -t EXISTING_ASSET_URLS < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].apiUrl')
          for asset_url in "${EXISTING_ASSET_URLS[@]}"; do
            gh api --method DELETE "$asset_url"
          done

      - name: 上传全部安装包到草稿
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          mapfile -d '' RELEASE_FILES < <(find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.deb' \) -print0)
          if [[ "${#RELEASE_FILES[@]}" -eq 0 ]]; then
            echo "::error::没有找到可发布的安装包。"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${RELEASE_FILES[@]}" --repo "$GITHUB_REPOSITORY"

      - name: 生成并上传完整更新清单
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,body,tagName > release-metadata-draft.json
          jq --arg published_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" '. + {publishedAt: $published_at}' release-metadata-draft.json > release-metadata.json
          node scripts/build-updater-manifest.mjs release-metadata.json release-assets latest.json
          gh release upload "$RELEASE_TAG" latest.json --repo "$GITHUB_REPOSITORY"

      - name: 正式发布完整 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
