name: 发布安装包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并发布的已有版本标签，例如 v0.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: win32
            arch: x64
          - name: macOS ARM64
            os: macos-15
            platform: darwin
            arch: arm64
          - name: macOS x64
            os: macos-15-intel
            platform: darwin
            arch: x64
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux
            arch: x64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: 使用最新发布工具
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin main:refs/remotes/origin/main --depth=1
          git checkout origin/main -- CHANGELOG.md scripts/build-release.mjs packaging/windows/AllSessionsLauncher.cs packaging/macos/AllSessionsLauncher.swift packaging/linux/AllSessionsLauncher.c

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Inno Setup
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $compiler = (Get-Command ISCC.exe).Source
          "ISCC_PATH=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 安装 Linux 托盘构建依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libayatana-appindicator3-dev libcurl4-openssl-dev libjson-glib-dev

      - name: 构建安装包
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node scripts/build-release.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --output release

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-installer
          if-no-files-found: error
          path: release/AllSessions-*

  publish:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: 检出更新日志工具
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: 提取当前版本更新日志
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node scripts/extract-release-notes.mjs "$RELEASE_TAG" CHANGELOG.md release-notes.md

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          test "${#assets[@]}" -gt 0
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --title "AllSessions $RELEASE_TAG" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          fi
