name: 发布 Tauri 安装包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并发布的已有版本标签，例如 v0.0.6"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
            bundles: nsis
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            platform: mac
            arch: arm64
            bundles: dmg
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            platform: mac
            arch: x64
            bundles: dmg
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            bundles: deb
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: 安装 pnpm
        run: corepack enable

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 构建依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 提取当前版本更新日志
        id: release_notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node scripts/extract-release-notes.mjs "$RELEASE_TAG" CHANGELOG.md release-notes.md
          {
            echo 'body<<ALLSESSIONS_RELEASE_NOTES'
            cat release-notes.md
            echo 'ALLSESSIONS_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: 准备 Node sidecar
        run: node scripts/prepare-tauri-sidecar.mjs --target ${{ matrix.target }}

      - name: 构建并发布 Tauri 安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: AllSessions ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          updaterJsonPreferNsis: true

      # v0.0.6 的旧更新器依赖这些名称；保留它们可完成一次平滑迁移。
      - name: 上传兼容安装包名称
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node scripts/collect-tauri-artifact.mjs --target ${{ matrix.target }} --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
          gh release upload "$RELEASE_TAG" release/AllSessions-* --clobber --repo "$GITHUB_REPOSITORY"
