[package]
name = "allsessions"
version = "0.4.2"
description = "本地 AI 会话工作台"
authors = ["yuluo"]
license = "Apache-2.0"
repository = "https://github.com/yuluod/AllSessions"
edition = "2024"
rust-version = "1.100"

[lib]
name = "allsessions_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[dependencies]
age = "0.11.3"
dirs = "7"
jiff = "1.0"
md5 = "0.8.1"
notify = "8"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false }
rusqlite = { version = "0.42", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.11"
tempfile = "3"
toml = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zstd = "0.14"

# 运行时切换程序坞图标；这些 crate 已作为 wry 的 macOS 依赖在树中，不引入新代码。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false
